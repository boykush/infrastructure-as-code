apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/argoproj-labs/argocd-image-updater//config/default?ref=v1.3.0

patches:
  - target:
      kind: Deployment
      name: argocd-image-updater-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-image-updater-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-image-updater-controller
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
