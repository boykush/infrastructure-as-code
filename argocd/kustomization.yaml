apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.5.1
  - image-updater

# Upstream ships no resource requests. On a single 2 vCPU / 4GB node the
# scheduler needs them to reason about what else fits, so every component gets
# a modest floor and a memory ceiling.
patches:
  # SSO is not configured, so dex would only sit in RAM.
  - target:
      kind: Deployment
      name: argocd-dex-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        replicas: 0

  # TLS ends at Cloudflare, so the tunnel reaches the server in plain HTTP like
  # every other route; with TLS on, the server answers that with a redirect to
  # https that loops back through the tunnel. Read at startup: a change here
  # waits for argocd-server's next restart.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"

  # No login of its own: Access (terraform/access.tf) is the only lock, and
  # whoever gets through it is the owner, so the anonymous user is admin. Both
  # settings are read live, with no restart.
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        users.anonymous.enabled: "true"

  - target:
      kind: ConfigMap
      name: argocd-rbac-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        policy.default: role:admin

  # With anonymous as admin, whatever reaches the server owns the cluster, so
  # only the tunnel may: the MCP servers in this cluster face the internet with
  # no login of their own. Upstream lets everything in. Probes from the node and
  # port-forward, which lands on localhost, are beyond a NetworkPolicy's reach.
  - target:
      kind: NetworkPolicy
      name: argocd-server-network-policy
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-server-network-policy
      spec:
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: cloudflared
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudflared
            ports:
              - port: 8080
                protocol: TCP

  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    memory: 1Gi

  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 512Mi

  - target:
      kind: Deployment
      name: argocd-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-server
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 256Mi

  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 128Mi

  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-applicationset-controller
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 128Mi

  - target:
      kind: Deployment
      name: argocd-notifications-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-notifications-controller
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
