name: Claude Code Token
description: >-
  Reads the Claude Code OAuth token from Parameter Store using the calling job's
  own GitHub OIDC identity, so no repository holds a copy of it. The job needs
  `id-token: write`; the AWS CLI is already on GitHub-hosted runners.

inputs:
  role-to-assume:
    description: >-
      ARN of the reader role (terraform output claude_code_role_arn). The
      account id is not a secret and the ARN is useless without a matching
      OIDC sub, so it is written here and callers pass nothing.
    required: false
    default: "arn:aws:iam::509266991346:role/github-actions-claude-code"
  aws-region:
    description: Region the parameter lives in.
    required: false
    default: "ap-northeast-1"
  parameter-name:
    description: Parameter Store path of the token.
    required: false
    default: "/claude-code/oauth-token"

outputs:
  token:
    description: The Claude Code OAuth token. Masked, so it is safe to pass on.
    value: ${{ steps.read.outputs.token }}

runs:
  using: composite

  steps:
    # Without this, an unset ARN surfaces as a credentials error several steps
    # later, pointing at AWS rather than at the missing input.
    - name: Check the role is named
      shell: bash
      env:
        ROLE_TO_ASSUME: ${{ inputs.role-to-assume }}
      run: |
        set -euo pipefail
        if [ -z "${ROLE_TO_ASSUME}" ]; then
          echo "::error::role-to-assume is empty — pass the ARN or set this action's default, see the README"
          exit 1
        fi

    - name: Assume the reader role
      id: credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}
        # Hands the credentials to the next step only, instead of exporting them
        # to the job: the Claude step that follows runs arbitrary code, and this
        # is the one separation that workload allows.
        output-credentials: true
        output-env-credentials: false

    - name: Read the token
      id: read
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.credentials.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.credentials.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.credentials.outputs.aws-session-token }}
        AWS_REGION: ${{ inputs.aws-region }}
        PARAMETER_NAME: ${{ inputs.parameter-name }}
      run: |
        set -euo pipefail
        token="$(aws ssm get-parameter \
          --name "${PARAMETER_NAME}" \
          --with-decryption \
          --query Parameter.Value \
          --output text)"
        # text output prints a literal None for an empty parameter, and a value
        # carrying a line break would reach GITHUB_OUTPUT as two lines, of which
        # only the first is masked. Refuse both without echoing the value.
        case "${token}" in
          "" | None)
            echo "::error::${PARAMETER_NAME} is empty — write the token first, see the README"
            exit 1
            ;;
          *[[:space:]]*)
            echo "::error::${PARAMETER_NAME} contains whitespace — rewrite it with 'mise run claude:token'"
            exit 1
            ;;
        esac
        echo "::add-mask::${token}"
        echo "token=${token}" >> "${GITHUB_OUTPUT}"
