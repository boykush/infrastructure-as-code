name: Cluster Secrets

# Carries every Secret the cluster holds from Parameter Store into it, so none
# is made by hand with kubectl. Dispatch only: it writes Secrets, which is never
# something a push should do. Re-running it is how a value is rotated, and how
# they all come back after the cluster is rebuilt.
on:
  workflow_dispatch:

concurrency:
  group: cluster-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the reader role, see below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # --expiry-seconds embeds a token that dies with the run, instead of the
      # doctl exec plugin the default kubeconfig would call.
      - name: Fetch kubeconfig
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save boykush-cluster --expiry-seconds 600

      # Credentials for reading the parameters. Nothing is stored anywhere: the
      # role is assumed with this run's OIDC token, it may read that one path,
      # and only this repository can assume it (terraform/aws.tf).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-cluster-secrets

      # A parameter is <path>/<namespace>/<secret>/<key>, so what exists under
      # the path is the whole list: a new Secret is new parameters and no edit
      # here. The values go from the CLI through a file into kubectl, so they
      # never enter argv or the log; what is printed is the names.
      - name: Apply the secrets
        env:
          PARAMETER_PATH: /cluster-secrets
        run: |
          set -euo pipefail
          umask 077
          parameters="${RUNNER_TEMP}/parameters.json"
          trap 'rm -f "${parameters}"' EXIT
          aws ssm get-parameters-by-path \
            --path "${PARAMETER_PATH}" \
            --recursive \
            --with-decryption \
            --output json > "${parameters}"

          if [ "$(jq '.Parameters | length' "${parameters}")" -eq 0 ]; then
            echo "::error::nothing under ${PARAMETER_PATH} — write the values first, see the README"
            exit 1
          fi
          jq -r '.Parameters[].Name' "${parameters}"

          # A name of any other depth would land under the wrong namespace or
          # Secret rather than fail, so it stops the run before anything is written.
          entries='[.Parameters[] | {parts: (.Name | ltrimstr($path + "/") | split("/")), value: .Value}]'
          if jq -e --arg path "${PARAMETER_PATH}" "${entries} | any(.parts | length != 3)" "${parameters}" > /dev/null; then
            echo "::error::every parameter has to be ${PARAMETER_PATH}/<namespace>/<secret>/<key>"
            exit 1
          fi

          # Argo CD makes a namespace only when it first syncs the Application,
          # which on a rebuilt cluster can be after this runs.
          jq -r --arg path "${PARAMETER_PATH}" "${entries} | map(.parts[0]) | unique[]" "${parameters}" |
            while read -r namespace; do
              kubectl get namespace "${namespace}" > /dev/null 2>&1 || kubectl create namespace "${namespace}"
            done

          jq --arg path "${PARAMETER_PATH}" "${entries}"'
            | group_by(.parts[0:2])
            | {apiVersion: "v1", kind: "List", items: map({
                apiVersion: "v1",
                kind: "Secret",
                metadata: {namespace: .[0].parts[0], name: .[0].parts[1]},
                data: (map({(.parts[2]): (.value | @base64)}) | add)
              })}' "${parameters}" | kubectl apply -f -
