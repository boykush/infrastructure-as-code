# Ships the plugins under plugins/ from here: boykush/workflows writes and checks their
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@53a2811bef16e4c4c2962ab9745a4f5c2550fc34
    with:
      path: plugins
    permissions:
      contents: write
