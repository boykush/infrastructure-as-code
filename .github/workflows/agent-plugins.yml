# Ships the plugins under plugins/ from here: boykush/workflows writes and checks their
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@76a9bee67e70ad4f6f4181e233827a9373c91653
    with:
      path: plugins
    permissions:
      contents: write
