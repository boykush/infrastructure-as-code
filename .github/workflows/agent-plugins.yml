# Ships the plugins under plugins/ from here: boykush/workflows writes and checks their
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@4600601e7b106a8e621a0dfe1beeefe6f8de9d87
    with:
      path: plugins
    permissions:
      contents: write
