# Ships the plugins under plugins/ from here: boykush/workflows writes and checks their
# apm.yml, and tags each version for consumers to pin.
name: agent-plugins

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  agent-plugins:
    uses: boykush/workflows/.github/workflows/agent-plugins.yml@4afdafb12d0db74a6d0a79c4711211105ac9fc22
    with:
      path: plugins
    permissions:
      contents: write
