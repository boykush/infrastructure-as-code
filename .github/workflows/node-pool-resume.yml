name: Node Pool Resume

# Brings the worker node back and confirms the wiki is served again, which is
# the half of the pair that can fail in a way worth noticing.
on:
  schedule:
    # Counted back from a 10:00 JST deadline: the worst delay measured here is
    # 3h02m, and with the 20 minute rollout budget on top that lands at 09:59.
    # Minute :37 dodges the top of the hour. See the README.
    - cron: "37 21 * * *" # 06:37 JST
  workflow_dispatch:

# Shared with Node Pool Park so the two can never overlap. A queued run is kept
# rather than dropped: losing a resume would cost a whole day.
concurrency:
  group: node-pool
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resume:
    name: Resume
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # doctl and kubectl come from mise.toml, the same pins the rest of the repo uses.
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Scale the node pool to 1
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster node-pool update boykush-cluster default --count 1

      # The rollout is the whole gate. Waiting on a Ready node first looked
      # safer but was worse: a node being deleted still reports Ready, so the
      # check passed against the outgoing node. Rollout cannot be fooled that
      # way, and 20 minutes covers provision, join and the first GHCR pull.
      - name: Wait for the endpoint to come back
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save boykush-cluster --expiry-seconds 3600
          kubectl -n cloudflared rollout status deployment/cloudflared --timeout=1200s
          kubectl -n remote-mcp-server rollout status deployment/wiki --timeout=1200s
          kubectl -n remote-mcp-server rollout status deployment/adr --timeout=1200s
          kubectl -n backstage rollout status deployment/backstage --timeout=1200s

      # This runs unattended before dawn, so a failure has to explain itself in
      # the log. Neither command prints any node address.
      - name: Report cluster state on failure
        if: failure()
        run: |
          kubectl get nodes || true
          kubectl get pods --all-namespaces || true
