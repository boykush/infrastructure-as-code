name: Node Pool Park

# Takes the worker node to 0. It is billed per second and is all of the cluster's
# bill but Jaeger's volume, so the bill only moves by not running it. Billing caps
# at 672 hours a month, so five hours a night saves just $0.43-3.65 (2026-09).
# While parked every tunnel route answers 530. To stay up a night, disable this.
on:
  schedule:
    # Minute :37 dodges the top of the hour, where GitHub queues scheduled runs
    # behind everyone else's. 01:37 JST is late enough that only one of the 36
    # days with commits in the last 72 ran past it. GitHub drops a schedule after
    # 60 idle days, which Image Updater's commits keep from happening.
    - cron: "37 16 * * *" # 01:37 JST
  workflow_dispatch:

# Shared with Node Pool Resume so the two can never overlap. A queued run is
# kept rather than dropped: losing a resume would cost a whole day. The flip
# side: a park five hours late queues behind the resume and holds the cluster
# down all day. The worst delay seen is 3h02m (2026-09-13).
concurrency:
  group: node-pool
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  park:
    name: Park
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the role that reads the DO token, see below
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # doctl comes from mise.toml, the same pin the rest of the repo uses.
      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      # The DO token sits in Parameter Store, not a repository secret. The role
      # may read that one parameter and trusts this repository's main alone
      # (ci_secret_readers in terraform/aws.tf); `mise run ci:secret` writes it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-ci-secrets-infrastructure-as-code-doctl

      - name: Read the DO token
        run: mise run ci:read-secrets DIGITALOCEAN_ACCESS_TOKEN=digitalocean/infrastructure-as-code

      - name: Scale the node pool to 0
        run: |
          set -euo pipefail
          doctl kubernetes cluster node-pool update boykush-cluster default --count 0
