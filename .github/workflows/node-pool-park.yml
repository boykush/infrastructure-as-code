name: Node Pool Park

# Takes the worker node to 0. It is billed per second and is all of the cluster's
# bill but Jaeger's volume, so the bill only moves by not running it. Billing caps
# at 672 hours a month, so five hours a night saves just $0.43-3.65 (2026-09).
# While parked every tunnel route answers 530. To stay up a night, disable this.
on:
  schedule:
    # Minute :37 dodges the top of the hour, where GitHub queues scheduled runs
    # behind everyone else's. 01:37 JST is late enough that only one of the 36
    # days with commits in the last 72 ran past it. GitHub drops a schedule after
    # 60 idle days, which Image Updater's commits keep from happening.
    - cron: "37 16 * * *" # 01:37 JST
  workflow_dispatch:

# Shared with Node Pool Resume so the two can never overlap. A queued run is
# kept rather than dropped: losing a resume would cost a whole day. The flip
# side: a park five hours late queues behind the resume and holds the cluster
# down all day. The worst delay seen is 3h02m (2026-09-13).
concurrency:
  group: node-pool
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  park:
    name: Park
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # doctl comes from mise.toml, the same pin the rest of the repo uses.
      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Scale the node pool to 0
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster node-pool update boykush-cluster default --count 0
