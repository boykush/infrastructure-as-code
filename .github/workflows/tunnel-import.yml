name: Tunnel Import

# Adopts Cloudflare resources that already exist into Terraform state, for when
# something was made in the dashboard ahead of the configuration. Dispatch only:
# it writes state, so it must never fire on a push. The same script runs on a
# workstation — see the tunnel section of the README.
on:
  workflow_dispatch:

# Shares the plan/apply workflow's group so a state write never overlaps one.
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init -input=false

      # The script masks the IDs it discovers before printing anything, so the
      # log of this public repository stays free of them.
      - name: Import
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: .github/scripts/import-tunnel.sh
