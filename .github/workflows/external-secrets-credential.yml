name: External Secrets Credential

# Puts the access key External Secrets Operator reads Parameter Store with into
# the cluster — the one Secret it cannot fetch for itself. Dispatch only: it
# writes a Secret, which is never something a push should do. Re-running it is
# how the key is rotated, and how it comes back after the cluster is rebuilt.
on:
  workflow_dispatch:

concurrency:
  group: external-secrets-credential
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the reader role, see below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # --expiry-seconds embeds a token that dies with the run, instead of the
      # doctl exec plugin the default kubeconfig would call.
      - name: Fetch kubeconfig
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save boykush-cluster --expiry-seconds 600

      # Credentials for reading the access key. Nothing is stored anywhere: the
      # role is assumed with this run's OIDC token, it may read that one path,
      # and only a run of this repository's main can assume it (terraform/aws.tf),
      # so dispatch it from main.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-external-secrets

      # Both halves go from the CLI into files, so they never enter argv or the
      # log. Text output ends each with a line break the key must not carry,
      # which the command substitution drops.
      - name: Apply the secret
        env:
          PARAMETER_PATH: /external-secrets
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d)"
          trap 'rm -rf "${dir}"' EXIT
          for key in access-key-id secret-access-key; do
            printf '%s' "$(aws ssm get-parameter \
              --name "${PARAMETER_PATH}/${key}" \
              --with-decryption \
              --query Parameter.Value \
              --output text)" > "${dir}/${key}"
            # text output prints a literal None for an empty parameter, which
            # would otherwise reach the cluster as if it were a key.
            if [ ! -s "${dir}/${key}" ] || [ "$(cat "${dir}/${key}")" = "None" ]; then
              echo "::error::${PARAMETER_PATH}/${key} is empty — mint the key first, see the README"
              exit 1
            fi
          done
          # Argo CD makes the namespace when it first syncs the operator, which
          # on a rebuilt cluster can be after this runs.
          kubectl get namespace external-secrets > /dev/null 2>&1 || kubectl create namespace external-secrets
          kubectl -n external-secrets create secret generic parameter-store-credentials \
            --from-file=access-key-id="${dir}/access-key-id" \
            --from-file=secret-access-key="${dir}/secret-access-key" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Show which fields landed
        run: kubectl -n external-secrets get secret parameter-store-credentials -o go-template='{{range $k,$v := .data}}{{$k}}{{"\n"}}{{end}}'
