name: Image Updater Credential

# Puts the GitHub App credential that Image Updater writes back with into the
# cluster. Dispatch only: it writes a Secret, which is never something a push
# should do. Re-running it is how the key is rotated, and how the credential
# comes back after the cluster is rebuilt.
on:
  workflow_dispatch:

concurrency:
  group: image-updater-credential
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the reader role, see below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # --expiry-seconds embeds a token that dies with the run, instead of the
      # doctl exec plugin the default kubeconfig would call. The cluster's id
      # and endpoint are masked first, so a kubectl error cannot print either
      # into the log of this public repository.
      - name: Fetch kubeconfig
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$(doctl kubernetes cluster get boykush-cluster --format ID --no-header)"
          doctl kubernetes cluster kubeconfig save boykush-cluster --expiry-seconds 600
          echo "::add-mask::$(kubectl config view -o jsonpath='{.clusters[0].cluster.server}')"

      # Credentials for reading the private key. Nothing is stored anywhere: the
      # role is assumed with this run's OIDC token, it may read that one
      # parameter, and only this repository can assume it (terraform/aws.tf).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-image-updater

      # The private key lives in Parameter Store, not in a repository secret;
      # the two ids just say which App it belongs to. The key goes straight from
      # the CLI into a file, so it never enters argv or the log.
      - name: Apply the secret
        env:
          APP_ID: ${{ vars.IMAGE_UPDATER_APP_ID }}
          INSTALLATION_ID: ${{ vars.IMAGE_UPDATER_APP_INSTALLATION_ID }}
          PARAMETER_NAME: /image-updater/app-private-key
        run: |
          set -euo pipefail
          for name in APP_ID INSTALLATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty — register it first, see the README"
              exit 1
            fi
          done
          umask 077
          key="${RUNNER_TEMP}/app.pem"
          trap 'rm -f "${key}"' EXIT
          aws ssm get-parameter \
            --name "${PARAMETER_NAME}" \
            --with-decryption \
            --query Parameter.Value \
            --output text > "${key}"
          # text output prints a literal None for an empty parameter, which
          # would otherwise reach the cluster as if it were a key.
          if [ ! -s "${key}" ] || [ "$(cat "${key}")" = "None" ]; then
            echo "::error::${PARAMETER_NAME} is empty — write the key first, see the README"
            exit 1
          fi
          kubectl -n argocd create secret generic image-updater-git-creds \
            --from-literal=githubAppID="${APP_ID}" \
            --from-literal=githubAppInstallationID="${INSTALLATION_ID}" \
            --from-file=githubAppPrivateKey="${key}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Show which fields landed
        run: kubectl -n argocd get secret image-updater-git-creds -o go-template='{{range $k,$v := .data}}{{$k}}{{"\n"}}{{end}}'
