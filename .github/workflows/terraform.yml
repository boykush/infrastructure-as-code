name: Terraform

# Runs only when something that affects a plan/apply changes: the Terraform
# config and its provider lock (terraform/**), the toolchain pins, and this
# workflow. A README-only or manifest-only PR skips the run.
#
# The pull_request and push triggers share one path list via a YAML anchor
# (&tf-paths defines it, *tf-paths reuses it) so the two never drift.
on:
  pull_request:
    branches: [main]
    paths: &tf-paths
      - "terraform/**"
      - "mise.toml"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths: *tf-paths

# Serialize runs so state operations never overlap (belt and braces alongside
# the HCP state lock).
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # tfcmt plan/apply comments
      issues: write # tfcmt labels
      id-token: write # assume the AWS role, see below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Credentials for the aws provider. Nothing is stored anywhere: the role is
      # assumed with this run's OIDC token and the session dies with the job.
      # Only this repository's main branch can assume it (terraform/aws.tf).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::509266991346:role/github-actions-terraform

      # Installs the toolchain pinned in mise.toml. mise installs the raw
      # terraform binary (no stdout-capturing wrapper), which is what tfcmt
      # needs to parse plan/apply output.
      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # Posts terraform plan/apply results as a PR comment (no github-script).
      - name: Install tfcmt
        env:
          TFCMT_VERSION: v4.14.15
        run: |
          curl -fsSL -o /tmp/tfcmt.tar.gz \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/${TFCMT_VERSION}/tfcmt_linux_amd64.tar.gz"
          tar -C /usr/local/bin -xzf /tmp/tfcmt.tar.gz tfcmt
          tfcmt --version

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        env:
          # Authenticates the `cloud` block against HCP Terraform (replaces
          # setup-terraform's cli_config_credentials_token).
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_access_owner_email: ${{ secrets.ACCESS_OWNER_EMAIL }}
        run: tfcmt plan -- terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'push'
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_access_owner_email: ${{ secrets.ACCESS_OWNER_EMAIL }}
        run: tfcmt apply -- terraform apply -input=false -auto-approve -no-color
