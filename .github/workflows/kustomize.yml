name: kustomize

# Every overlay is built on every pull request. A build takes seconds and reaches
# no cluster, so there is nothing to gain by filtering paths — and a required
# check that a path filter can skip never reports at all.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  kustomize:
    name: kustomize
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # kubectl carries kustomize, so the pin in mise.toml covers this and no tool
      # is added. The remote bases under argocd/ are pinned by ref, so what builds
      # here is what Argo CD renders from the same commit.
      - name: Build every overlay
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -name kustomization.yaml -not -path './.git/*' -printf '%h\n' | sort)
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            kubectl kustomize "$dir" >/dev/null
            echo "::endgroup::"
          done
          echo "built ${#dirs[@]} overlays"
