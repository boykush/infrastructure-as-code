# This repository's entities in boykush's Backstage catalog, found on main by its
# GitHub discovery (applications/backstage/app-config.yaml). How an entity is
# written — which edges to draw, what a tag means — is set in github-management's
# AGENTS.md and the comments atop its catalog/ files, which still hold the rest.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: infrastructure-as-code
  description: >-
    DOKS クラスタを Terraform で、その上のアプリを Argo CD で管理する repo。remote で動かすもの（MCP
    サーバーなど）を載せ、Cloudflare Tunnel で公開する。image は各 repo が build し、ここは manifest だけを持つ。workload
    の trace は OpenTelemetry Collector が受けて Jaeger へ流す。workflow が repo secret の代わりに使う資格（Claude
    Code の token・GitHub App の鍵）の置き場と信頼も、ここが AWS に作る——どの repo が使えるかは terraform/variables.tf
    の claude_code_repositories と github_apps が決める。Image Updater の書き戻しは、github-management が張る ruleset
    の bypass に頼る
  annotations:
    # The Docs tab: how-tos for the steps a person does by hand (mkdocs.yml, docs/).
    backstage.io/techdocs-ref: dir:.
    # Argo CD and OpenCost keep the part-of their upstream gives them.
    backstage.io/kubernetes-label-selector: app.kubernetes.io/part-of in (infrastructure-as-code,argocd,opencost)
  links:
    - url: https://app.terraform.io/app/boykush/workspaces/infrastructure-as-code
      title: HCP Terraform workspace
      icon: dashboard
    - url: https://argocd.boykush.com
      title: Argo CD
      icon: dashboard
    - url: https://jaeger.boykush.com
      title: Jaeger
      icon: dashboard
    - url: https://opencost.boykush.com
      title: OpenCost
      icon: dashboard
spec:
  type: repository
  lifecycle: production
  owner: user:boykush
  system: runtime
  providesApis:
    - jaeger-mcp
    - opencost-mcp
  consumesApis:
    - adr-mcp
    - catalog-mcp
    - jaeger-mcp
    - opencost-mcp
  dependsOn:
    - component:adr
    - component:wiki
    - component:github-management
    - component:backstage-app
    - component:workflows
    - resource:doks-cluster
    - resource:cloudflare-tunnel
    - resource:r2
    - resource:hcp-terraform
    - resource:ghcr
    - resource:image-updater-app
    - resource:repo-reader-app
    - resource:aws-parameter-store
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: jaeger-mcp
  description: >-
    クラスタの workload が出した trace を読む remote MCP サーバー。読み取り専用。ほかの MCP と違い Cloudflare
    Access の内側にある——入口は Access の OAuth で、通るのは owner だけ。公開エンドポイントは
    infrastructure-as-code が持つ
  links:
    - url: https://github.com/boykush/infrastructure-as-code/blob/main/plugins/jaeger-remote-mcp/mcp.json
      title: 接続先の持ち主（plugin jaeger-remote-mcp）
      icon: github
spec:
  type: mcp-server
  lifecycle: production
  owner: user:boykush
  system: runtime
  remotes:
    - type: streamable-http
      url: https://jaeger-mcp.boykush.com/mcp
---
apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: jaeger-remote-mcp
  description: >-
    jaeger-mcp への参照を1つ持つだけの plugin（Agent Plugins の形）。apm が読む `apm.yml` を隣に生成して持つ
  links:
    - url: https://backstage.boykush.com/catalog/default/api/jaeger-mcp
      title: MCP サーバー（jaeger-mcp）
      icon: kind:api
spec:
  type: plugin
  lifecycle: production
  owner: user:boykush
  system: runtime
  skills: []
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: opencost-mcp
  description: >-
    クラスタの workload ごとのコストと node の idle を読む remote MCP サーバー。読み取り専用。jaeger-mcp と同じく
    Cloudflare Access の内側にあり、通るのは owner だけ。公開エンドポイントは infrastructure-as-code が持つ
  links:
    - url: https://github.com/boykush/infrastructure-as-code/blob/main/apm.yml
      title: 接続先の持ち主（infrastructure-as-code）
      icon: github
spec:
  type: mcp-server
  lifecycle: experimental
  owner: user:boykush
  system: runtime
  remotes:
    - type: streamable-http
      url: https://opencost-mcp.boykush.com/mcp
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: doks-cluster
  description: DigitalOcean Kubernetes。remote で動かすものの実行基盤で、夜間は node を落とす
spec:
  type: kubernetes-cluster
  owner: user:boykush
  system: runtime
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: cloudflare-tunnel
  description: >-
    cluster の中を公開する唯一の経路。どのホスト名を通すかは infrastructure-as-code の tunnel_routes が決め、owner
    にしか開かないものには Cloudflare Access が前段に立つ
spec:
  type: network
  owner: user:boykush
  system: runtime
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: r2
  description: >-
    Cloudflare R2。finlake のデータレイクの置き場で、バケットは infrastructure-as-code の terraform/r2.tf
    が作る。cluster の sync CronJob と MCP サーバーが同じ token で読み書きする
spec:
  type: object-storage
  owner: user:boykush
  system: runtime
---
# The console links carry var.aws_region (terraform/variables.tf); move them with it.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: aws-kms
  description: >-
    AWS KMS。workflow が GitHub App として署名する鍵の置き場で、鍵は取り出せず、署名できるのは App ごとの role だけ。どの App
    の鍵があり、どの repo が使えるかは terraform/variables.tf の github_apps が決める。Terraform が作るのは中身の無い key
    で、material は人が mise run app:key-import で入れる（skill add-github-app）
  links:
    - url: https://ap-northeast-1.console.aws.amazon.com/kms/home?region=ap-northeast-1#/kms/keys
      title: KMS の鍵（AWS console）
      icon: dashboard
spec:
  type: key-management
  owner: user:boykush
  system: runtime
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: aws-parameter-store
  description: >-
    AWS Systems Manager Parameter Store。repo secret と cluster の Secret の代わりに資格情報を置く場所——Claude
    Code の token（claude_code_repositories の repo が run の OIDC で読む）、cluster の Secret の元（External
    Secrets Operator が読む）、その operator 自身の access key。パスはどれも terraform/variables.tf
    にある。Terraform は値を書かないので、入れるのも入れ替えるのも人の作業（skill rotate-credential）
  links:
    - url: https://ap-northeast-1.console.aws.amazon.com/systems-manager/parameters?region=ap-northeast-1
      title: Parameter Store（AWS console）
      icon: dashboard
spec:
  type: secret-store
  owner: user:boykush
  system: runtime
---
# One Resource per parameter in Parameter Store, so the catalog filtered to type
# ssm-parameter lists them; the title is the path, the name <service>-<what it is>.
# Each has TechDocs for a person (issue, write, check, retire) under
# parameters/<path>/; who reads it stays with its owner.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: claude-code-oauth-token
  title: /claude-code/oauth-token
  description: >-
    Claude Code Actions の OAuth token。claude_code_repositories の repo の workflow が run の OIDC で読む。有効期間は1年
  annotations:
    backstage.io/techdocs-ref: dir:./parameters/claude-code/oauth-token
spec:
  type: ssm-parameter
  owner: user:boykush
  system: runtime
  dependsOn:
    - resource:aws-parameter-store
---
