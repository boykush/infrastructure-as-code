# boykush/finlake: household money data in an R2 bucket (terraform/r2.tf). The
# owner uploads Money Forward ME's CSVs to the raw layer of the bucket; the sync
# CronJob here turns them into the product. The MCP server that serves the
# product also belongs here, and has not joined yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finlake
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/boykush/infrastructure-as-code
    targetRevision: main
    path: applications/finlake
  destination:
    server: https://kubernetes.default.svc
    namespace: finlake
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
