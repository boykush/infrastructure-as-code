# boykush/finlake: household money data in an R2 bucket (terraform/r2.tf). The
# ingest runs on the owner's machine, where the Money Forward session cookie
# lives, and writes to R2 directly. What belongs here is only the MCP server that
# serves the result, and it has not joined yet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finlake
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/boykush/infrastructure-as-code
    targetRevision: main
    path: applications/finlake
  destination:
    server: https://kubernetes.default.svc
    namespace: finlake
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      # Empty until the MCP server joins. Without this the auto-sync refuses to
      # prune the last resources away, and the retired ingest CronJob would stay.
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
