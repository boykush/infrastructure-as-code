# ClusterIP only: the internet reaches this through the tunnel, and only past
# Cloudflare Access. The tunnel addresses it as headlamp.headlamp.svc.cluster.local:4466.
apiVersion: v1
kind: Service
metadata:
  name: headlamp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 4466
      targetPort: http
