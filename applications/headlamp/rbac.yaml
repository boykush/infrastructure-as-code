# Everyone who opens Headlamp acts as this account (deployment.yaml), so what
# it may read is all the UI can show. That is the node, the pods on it and
# their usage: no Secrets, no logs, and no verb that changes anything.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-node-usage
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, events]
    verbs: [get, list, watch]
  # Served by applications/metrics-server.
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-node-usage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-node-usage
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
