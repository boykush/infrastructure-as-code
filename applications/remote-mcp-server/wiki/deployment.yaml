# The MCP server for boykush/wiki. Named for the wiki rather than for MCP,
# because everything in this namespace is an MCP server — the name has to say
# which one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki
spec:
  # One node, and the wiki is baked into the image, so there is no state to
  # spread across replicas.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiki
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scraps
          # Built in boykush/wiki: the scraps binary plus the wiki content, with
          # SCRAPS_DIRECTORY baked in so the path stays that repository's business.
          # The tag here is only what the kustomization's images block matches
          # on; what actually runs is the digest pinned there.
          image: ghcr.io/boykush/wiki-mcp-server:main
          # The entrypoint is already `scraps mcp serve --http`, so the first
          # argument is the listen address. scraps validates Host (rmcp's DNS
          # rebinding protection) and answers 403 to any it was not given: the
          # tunnel forwards under the public name, and agentgateway dials the
          # Service under its in-cluster one.
          args:
            - "0.0.0.0:1113"
            - "--allowed-host"
            - "wiki-mcp.boykush.com"
            - "--allowed-host"
            - "wiki.remote-mcp-server.svc.cluster.local"
          env:
            # Setting this is what turns scraps's tracing on; without it scraps
            # sends nothing. The collector is the only address a workload is
            # given (applications/otel-collector/service.yaml), and the port is
            # its HTTP one because scraps speaks OTLP over HTTP alone.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel-collector.svc.cluster.local:4318
            # The name this server has on the tunnel and in the catalog, rather
            # than one that names the binary every scraps wiki would share.
            - name: OTEL_SERVICE_NAME
              value: wiki-mcp
            # OpenTelemetry's GenAI semantic conventions leave a tool call's
            # arguments off a span unless asked for, and scraps withholds the
            # error text with them. This deployment wants both in its traces.
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "true"
          ports:
            - name: http
              containerPort: 1113
          # The MCP endpoint only answers POST, so readiness checks the socket.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
