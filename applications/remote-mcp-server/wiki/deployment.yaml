# The MCP server for boykush/wiki. Named for the wiki rather than for MCP,
# because everything in this namespace is an MCP server — the name has to say
# which one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki
spec:
  # One node, and the wiki is baked into the image, so there is no state to
  # spread across replicas.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiki
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scraps
          # Built in boykush/wiki: the scraps binary plus the wiki content, with
          # SCRAPS_DIRECTORY baked in so the path stays that repository's business.
          image: ghcr.io/boykush/wiki-mcp-server:main
          # The tag is mutable and no digest is pinned behind it yet, so the
          # default IfNotPresent would keep serving whatever this node cached
          # the first time — including a scraps too old for the flag below.
          imagePullPolicy: Always
          # The entrypoint is already `scraps mcp serve --http`, so the first
          # argument is the listen address. The second names the Host header the
          # tunnel forwards under: scraps validates it (rmcp's DNS rebinding
          # protection) and would otherwise answer 403 to everything public.
          args:
            - "0.0.0.0:1113"
            - "--allowed-host"
            - "wiki-mcp.boykush.com"
          ports:
            - name: http
              containerPort: 1113
          # The MCP endpoint only answers POST, so readiness checks the socket.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
