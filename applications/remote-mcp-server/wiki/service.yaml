# ClusterIP only: the internet reaches this through the Cloudflare Tunnel and
# then agentgateway, both inside the cluster. agentgateway addresses this as
# wiki.remote-mcp-server.svc.cluster.local:1113.
apiVersion: v1
kind: Service
metadata:
  name: wiki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wiki
  ports:
    - name: http
      port: 1113
      targetPort: http
