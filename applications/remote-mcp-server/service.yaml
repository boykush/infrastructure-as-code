# ClusterIP only: the internet reaches this through the Cloudflare Tunnel in
# cloudflared.yaml, which connects from inside the cluster. Publishing the
# Service itself (NodePort, LoadBalancer) would put the port on the node's
# public IP with no TLS in front of it.
apiVersion: v1
kind: Service
metadata:
  name: remote-mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: remote-mcp-server
  ports:
    - name: http
      port: 1113
      targetPort: http
