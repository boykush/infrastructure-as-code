# What replaces `kubectl port-forward`. The MCP server itself stays on a
# ClusterIP: cloudflared dials *out* to Cloudflare and traffic comes back down
# that connection, so nothing listens on the node's public IP and no billable
# DigitalOcean load balancer is created. TLS and the public hostname are
# Cloudflare's half of the tunnel.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  # The tunnel is a client, not a listener, so a second replica would only buy
  # redundancy the single-node cluster cannot provide anyway.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2
          # The entrypoint is `cloudflared --no-autoupdate`, so the binary will
          # not replace itself and drift from the tag pinned above.
          args:
            # Metrics are the only listener this pod has; without them there is
            # no /ready for the kubelet to probe.
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # A remotely-managed tunnel: the hostname-to-Service mapping lives
            # in the Cloudflare dashboard rather than here, which is what lets
            # this repository stay free of the domain. The token is the whole
            # configuration, and it is a credential — like the Image Updater's
            # git creds it is created with kubectl and never committed.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Proxying one person's wiki reads; the floor is what keeps the
          # scheduler honest on a node that already carries Argo CD.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
