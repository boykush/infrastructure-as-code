apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One directory per MCP server, plus the rule that keeps their images current.
# Adding a server means adding its directory here and its image below.
resources:
  - adr
  - wiki
  - imageupdater.yaml

# Image Updater rewrites this block, pinning each digest behind its tag. It
# writes to the kustomization.yaml at the Application's path, which is this
# file, so the images stay here rather than in the per-server directories.
images:
  - name: ghcr.io/boykush/adr-mcp-server
    newName: ghcr.io/boykush/adr-mcp-server
    newTag: main
    digest: sha256:451cb95993d99300669e326b770b0297b8ae35c0bcb4b6aa3a9aca6bc29cc370
  - name: ghcr.io/boykush/wiki-mcp-server
    digest: sha256:b63646e6b7d3cb485268c32ecbdece5f7ca5514b246c3503584c83ccefed3c3a
    newName: ghcr.io/boykush/wiki-mcp-server
    newTag: main
