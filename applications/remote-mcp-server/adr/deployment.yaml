# The MCP server for boykush/adr: the decisions shared across boykush's
# repositories, served by adi. Named for the repository, like wiki, because the
# namespace already says it is an MCP server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adr
spec:
  # One node, and the decisions are baked into the image, so there is no state
  # to spread across replicas.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adr
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adi
          # Built in boykush/adr: the adi binary plus the decisions and the
          # .rule files beside them, with the model path baked in so it stays
          # that repository's business.
          # The tag here is only what the kustomization's images block matches
          # on; what actually runs is the digest pinned there.
          image: ghcr.io/boykush/adr-mcp-server:main
          # The entrypoint already ends in `--http`, so the only argument is the
          # listen address. Unlike scraps, adi needs no allowed host: it checks
          # Host only on connections accepted on loopback, and the tunnel's
          # arrive over the pod network.
          args:
            - "0.0.0.0:8080"
          env:
            # Setting this is what turns adi's tracing on; without it adi sends
            # nothing. The collector is the only address a workload is given
            # (applications/otel-collector/service.yaml), and the port is its
            # HTTP one because adi speaks OTLP over HTTP alone.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel-collector.svc.cluster.local:4318
            # The name this server has on the tunnel and in the catalog. adi has
            # none of its own to fall back on.
            - name: OTEL_SERVICE_NAME
              value: adr-mcp
            # OpenTelemetry's GenAI semantic conventions leave a tool call's
            # arguments off a span unless asked for, and adi withholds the error
            # text with them, since the text quotes them. This deployment wants
            # both in its traces.
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          # The MCP endpoint only answers POST, so readiness checks the socket.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
