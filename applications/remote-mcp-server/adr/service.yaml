# ClusterIP only: the internet reaches this through the Cloudflare Tunnel and
# then agentgateway, both inside the cluster. agentgateway addresses this as
# adr.remote-mcp-server.svc.cluster.local:8080.
apiVersion: v1
kind: Service
metadata:
  name: adr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adr
  ports:
    - name: http
      port: 8080
      targetPort: http
