# The part of the ingest CronJobs they have in common, patched into every
# CronJob of this kustomization (the name below is replaced by the target).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest
spec:
  # A second run while one is still going would only race it to the same object.
  concurrencyPolicy: Forbid
  # The node is parked overnight; a schedule missed then is not worth running late.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One retry, not the default six: an expired cookie fails the same way
      # every time, and repeated logins look worse to Money Forward than a gap.
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingest
              # Built in boykush/famoney. The tag here is only what the
              # kustomization's images block matches on; what runs is the
              # digest pinned there.
              image: ghcr.io/boykush/famoney:main
              env:
                - name: FAMONEY_LAKE_ROOT
                  value: s3://famoney
                # R2 speaks S3 with region "auto", addressed path-style.
                - name: FAMONEY_S3_REGION
                  value: auto
                - name: FAMONEY_S3_URL_STYLE
                  value: path
              # The endpoint carries the Cloudflare account id, which this public
              # repository does not hold, so it travels in the Secret with the
              # token: FAMONEY_S3_ENDPOINT, FAMONEY_S3_ACCESS_KEY_ID and
              # FAMONEY_S3_SECRET_ACCESS_KEY in famoney-r2, MONEYFORWARD_COOKIE in
              # famoney-moneyforward.
              envFrom:
                - secretRef:
                    name: famoney-r2
                - secretRef:
                    name: famoney-moneyforward
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              # The CSV is staged in a temp file before DuckDB copies it to R2.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
