# The official image, which is what create-app generates, run as-is: our part
# is only the config layered on top. Stateless — the database is the image's
# in-memory SQLite and the catalog is copied in from its own image on every
# start, so there is no volume to bill or back up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's USER is the name `node`; the kubelet needs the number to
        # prove it is not root.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # boykush/github-management builds the catalog into this image, so the
        # cluster needs no credential for that private repository. Its digest is
        # followed by Image Updater (imageupdater.yaml).
        - name: catalog
          image: ghcr.io/boykush/github-management-catalog:main
          command: [cp, -R, /catalog/., /shared/]
          volumeMounts:
            - name: catalog
              mountPath: /shared
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        # Backstage makes a span for every MCP tool call, but its image carries
        # OpenTelemetry's API without an SDK, so they go nowhere. This is what
        # the OpenTelemetry Operator injects for Node.js, copied in by hand: an
        # operator costs memory this node cannot spare. Its @opentelemetry/api
        # must not be older than Backstage's, or the spans stop without a word.
        - name: otel-instrumentation
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0
          command: [cp, -r, /autoinstrumentation/., /otel-auto-instrumentation-nodejs]
          volumeMounts:
            - name: otel-instrumentation
              mountPath: /otel-auto-instrumentation-nodejs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The copy is 133MB, and the page cache it passes through counts
          # against the limit: at 64Mi it was killed partway (measured locally).
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 256Mi
      containers:
        - name: backstage
          # Image Updater follows only what an ImageUpdater CR names, so this tag
          # is bumped by hand, like cloudflared's.
          image: ghcr.io/backstage/backstage:1.55.0
          # Replaces the image's CMD to drop app-config.production.yaml, which
          # expects PostgreSQL; the base app-config.yaml keeps in-memory SQLite.
          args:
            - node
            - packages/backend
            - --config
            - app-config.yaml
            - --config
            - /config/app-config.yaml
          env:
            # Loads the SDK the init container copied in, ahead of Backstage.
            - name: NODE_OPTIONS
              value: --require /otel-auto-instrumentation-nodejs/autoinstrumentation.js
            # The collector's filter picks Backstage's spans out by this name
            # (applications/otel-collector/config.yaml).
            - name: OTEL_SERVICE_NAME
              value: backstage
            # The collector is the only address a workload is given
            # (applications/otel-collector/service.yaml).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.otel-collector.svc.cluster.local:4318
            # The collector has a pipeline for traces alone, so these two would
            # have nowhere to go.
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # Only the spans Backstage makes itself are wanted: with every
            # instrumentation on, one tool call is 187 spans (measured locally
            # on 1.55.0). Naming one is how the rest are turned off, and this
            # one makes no spans.
            - name: OTEL_NODE_ENABLED_INSTRUMENTATIONS
              value: runtime-node
            # The default asks each cloud's metadata endpoint who it is running
            # on at startup, and none of them is here.
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: env,host,os
          ports:
            - name: http
              containerPort: 7007
          # Startup builds the whole app before the first readiness, so the startup
          # probe gives it room the liveness one does not.
          startupProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: catalog
              mountPath: /catalog
              readOnly: true
            - name: otel-instrumentation
              mountPath: /otel-auto-instrumentation-nodejs
              readOnly: true
            # The only place it writes; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Idles around 300Mi with this catalog (measured locally on 1.55.0).
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: backstage-app-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: catalog
          emptyDir:
            sizeLimit: 16Mi
        - name: otel-instrumentation
          emptyDir:
            sizeLimit: 256Mi
