# Layered over the image's app-config.yaml (the create-app defaults). Served at
# the tunnel hostname, behind Cloudflare Access (terraform/access.tf).
app:
  title: boykush catalog
  baseUrl: https://backstage.boykush.com
  # What the screens show. An array layered over another replaces it whole, so
  # every extension is listed here and nowhere else.
  extensions:
    # Replaces create-app's list, so putting the catalog at / is written again.
    - page:catalog:
        config:
          path: /
    # Rooted at the owner of every entity, so it reaches all of them without a
    # repository named. A new kind goes into selectedKinds as well: passing the
    # catalog's rules does not put it on the graph.
    - page:catalog-graph:
        config:
          rootEntityRefs: [user:default/boykush]
          selectedKinds: [user, component, api, system, resource, airesource]
          selectedRelations: [ownerOf, ownedBy, dependsOn, dependencyOf, providesApi, apiProvidedBy, consumesApi, apiConsumedBy, partOf, hasPart]
          unidirectional: false
          mergeRelations: true
          direction: LR
    # Home holds only the consoles no entity leads to; other links go on the
    # entity they belong to. Nothing saved per user: the in-memory database
    # forgets it on every restart.
    - page:home:
        config:
          defaultConfig:
            - component: HomePageToolkit
              column: 0
              row: 0
              width: 12
              height: 3
    # An icon works only as a key boykush/backstage-app registers (no brand
    # logos); any other key shows the generic link picture.
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: https://argocd.boykush.com
              label: Argo CD
              icon: dashboard
            - url: https://jaeger.boykush.com
              label: Jaeger
              icon: search
            - url: https://app.terraform.io/app/boykush/workspaces
              label: HCP Terraform
              icon: kind:resource
            - url: https://cloud.digitalocean.com/kubernetes/clusters
              label: DigitalOcean
              icon: kind:location
            - url: https://dash.cloudflare.com
              label: Cloudflare
              icon: kind:domain
            - url: https://console.aws.amazon.com
              label: AWS
              icon: kind:system
            - url: https://github.com/boykush?tab=repositories
              label: GitHub
              icon: github
    # The Welcome card is compiled into the image; these three show by default.
    - home-page-widget:home/getting-started: false
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/world-clock: false
organization:
  name: boykush
backend:
  baseUrl: https://backstage.boykush.com
  auth:
    # Backstage runs no action for an anonymous caller, a check its auth policy
    # does not govern, so the MCP server needs a principal. agentgateway sets
    # this once it has checked the caller (applications/agentgateway/config.yaml),
    # where the value has to match. A name tag rather than a credential: what it
    # reaches is read-only, so it is written here instead of synced from a secret.
    externalAccess:
      - type: static
        options:
          token: catalog-mcp-public-reader
          subject: catalog-mcp
auth:
  providers:
    guest:
      # Safe only because Cloudflare Access lets no one but the owner reach the
      # pages that sign in.
      dangerouslyAllowOutsideDevelopment: true
# Read as the repo-reader GitHub App: contents and metadata, read-only, on every
# repository of the owner. Unauthenticated, the catalog's refreshes alone would
# overrun GitHub's 60 requests an hour. Only installation tokens are used, so the
# client secret the schema asks for is never sent anywhere.
integrations:
  github:
    - host: github.com
      apps:
        - appId: 5369179
          clientId: Iv23liujtnslscb6qssg
          clientSecret: unused
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          allowedInstallationOwners: [boykush]

catalog:
  # Entities come only from the repositories' own catalog-info.yaml: registering
  # a location is refused, and a deleted entity is read back from where it came
  # from within minutes.
  readonly: true
  # Restates the image's defaults, since this list replaces them. User is let in
  # only from github-management, whose catalog/ holds the owner (and whose
  # catalog-info.yaml points there).
  rules:
    - allow: [Component, System, API, Resource, Location]
    - allow: [User]
      locations:
        - type: url
          pattern: https://github.com/boykush/github-management/**
  # Every repository with a catalog-info.yaml on its default branch, so none is
  # listed here.
  providers:
    github:
      boykush:
        organization: boykush
        catalogPath: /catalog-info.yaml
        # Off by default, which emits a Location for every repository and leaves the
        # catalog fetching a missing file from each, private ones by name.
        validateLocationsExist: true
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }

# The Kubernetes tab on an entity. The catalog picks the workloads by label
# (backstage.io/kubernetes-label-selector); this says only where to look. With
# no serviceAccountToken, the plugin uses the mounted one (rbac.yaml).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: boykush-cluster
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  # What rbac.yaml lets it list; the defaults include ConfigMaps and more.
  objectTypes:
    - pods
    - services
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs

# What coding agents connect to, through agentgateway as catalog-mcp.<domain>.
# The default server at /api/mcp-actions/v1 is always exposed and always serves
# every registered action, so agentgateway forwards to this named one alone and
# the filter keeps it to reading the catalog.
mcpActions:
  servers:
    catalog:
      name: boykush catalog
      instructions: >-
        The repositories under the boykush owner and the relations that cross
        them. Ask it which repositories a change reaches before treating the one
        in front of you as the whole of it.
      filter:
        include:
          - id: catalog:*
            attributes:
              readOnly: true
  # Puts each call's arguments and result on its span. Upstream leaves this off
  # because they can be sensitive; here they are catalog reads, and the spans
  # stay in the cluster, behind the same owner-only login as the catalog.
  tracing:
    capture:
      toolPayload: true
