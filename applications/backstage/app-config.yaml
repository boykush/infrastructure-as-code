# Layered over the image's app-config.yaml (the create-app defaults). Served at
# the tunnel hostname, behind Cloudflare Access (terraform/access.tf).
# app.extensions is absent on purpose: boykush/github-management holds it in
# /catalog/app-config.yaml, layered after this file, and an array written in
# both would have one replace the other.
app:
  title: boykush catalog
  baseUrl: https://backstage.boykush.com
organization:
  name: boykush
backend:
  baseUrl: https://backstage.boykush.com
  auth:
    # Backstage runs no action for an anonymous caller, a check its auth policy
    # does not govern, so the MCP server needs a principal. Cloudflare sets this
    # on the one path Access lets through (terraform/access.tf), where the value
    # has to match. It is a name tag rather than a credential: what it reaches
    # is read-only, so it is written here instead of synced from a secret.
    externalAccess:
      - type: static
        options:
          token: catalog-mcp-public-reader
          subject: catalog-mcp
auth:
  providers:
    guest:
      # Safe only because Cloudflare Access lets no one but the owner reach the
      # pages that sign in.
      dangerouslyAllowOutsideDevelopment: true
# The contract boykush/github-management states in the comments on catalog/all.yaml
# and catalog/Dockerfile: the catalog image puts its entry at /catalog/all.yaml, and
# User must be allowed on that location. Rules are matched against the entry
# location, so this covers every file it pulls in.
catalog:
  # Entities come only from github-management: registering a location is
  # refused, and a deleted entity is read back from its location within seconds.
  readonly: true
  locations:
    - type: file
      target: /catalog/all.yaml
      rules:
        - allow: [User]

# The Kubernetes tab on an entity. The catalog picks the workloads by label
# (backstage.io/kubernetes-label-selector); this says only where to look. With
# no serviceAccountToken, the plugin uses the mounted one (rbac.yaml).
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: boykush-cluster
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  # What rbac.yaml lets it list; the defaults include ConfigMaps and more.
  objectTypes:
    - pods
    - services
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
    - jobs
    - cronjobs

# What coding agents connect to, in the repositories that declare it through apm.
# The default server at /api/mcp-actions/v1 is always exposed and always serves
# every registered action, so Access opens this named one alone
# (terraform/access.tf) and the filter keeps it to reading the catalog.
mcpActions:
  servers:
    catalog:
      name: boykush catalog
      instructions: >-
        The repositories under the boykush owner and the relations that cross
        them. Ask it which repositories a change reaches before treating the one
        in front of you as the whole of it.
      filter:
        include:
          - id: catalog:*
            attributes:
              readOnly: true
  # Puts each call's arguments and result on its span. Upstream leaves this off
  # because they can be sensitive; here they are catalog reads this server
  # already hands to anyone, and the spans stay in the cluster.
  tracing:
    capture:
      toolPayload: true
