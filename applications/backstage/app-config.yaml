# Layered over the image's app-config.yaml (the create-app defaults). Served at
# the tunnel hostname, behind Cloudflare Access (terraform/access.tf).
app:
  title: boykush catalog
  baseUrl: https://backstage.boykush.com
  # An array, so this replaces the image's list rather than merging into it;
  # page:catalog is restated to keep the catalog at /.
  extensions:
    - page:catalog:
        config:
          path: /
    # Rooted at the owner of every entity, so the graph reaches all of them
    # without this file naming a single repo.
    - page:catalog-graph:
        config:
          rootEntityRefs: [user:default/boykush]
          selectedKinds: [user, component, api]
          selectedRelations: [ownerOf, ownedBy, dependsOn, dependencyOf, providesApi, apiProvidedBy, consumesApi, apiConsumedBy]
          unidirectional: false
          mergeRelations: true
          direction: LR
organization:
  name: boykush
backend:
  baseUrl: https://backstage.boykush.com
  auth:
    # The agents that read the catalog over MCP carry no identity to present,
    # and the policy cannot be lifted for one plugin from configuration alone.
    # What that opens is bounded outside: Cloudflare Access lets only the
    # catalog MCP server's path through without a login.
    dangerouslyDisableDefaultAuthPolicy: true
auth:
  providers:
    guest:
      # Safe only because Cloudflare Access lets no one but the owner reach the
      # pages that sign in.
      dangerouslyAllowOutsideDevelopment: true
# The contract boykush/github-management's AGENTS.md states: the catalog image
# puts its entry at /catalog/all.yaml, and User must be allowed on that location.
# Rules are matched against the entry location, so this covers every file it pulls in.
catalog:
  # Entities come only from github-management: registering a location is
  # refused, and a deleted entity is read back from its location within seconds.
  readonly: true
  locations:
    - type: file
      target: /catalog/all.yaml
      rules:
        - allow: [User]

# What coding agents connect to, in the repositories that declare it through apm.
# The default server at /api/mcp-actions/v1 is always exposed and always serves
# every registered action, so Access opens this named one alone
# (terraform/access.tf) and the filter keeps it to reading the catalog.
mcpActions:
  servers:
    catalog:
      name: boykush catalog
      instructions: >-
        The repositories under the boykush owner and the relations that cross
        them. Ask it which repositories a change reaches before treating the one
        in front of you as the whole of it.
      filter:
        include:
          - id: catalog:*
            attributes:
              readOnly: true
