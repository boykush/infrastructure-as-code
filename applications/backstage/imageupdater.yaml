# What Image Updater follows for Backstage: only the catalog image. A CR of its
# own rather than an entry in remote-mcp-server's, so each app's directory holds
# everything about it; it sits in argocd because the controller watches only there.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: backstage
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:image-updater-git-creds
    gitConfig:
      branch: main
      # Resolves to the kustomization.yaml at the Application's path.
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: backstage
      images:
        - alias: catalog
          imageName: ghcr.io/boykush/github-management-catalog:main
          commonUpdateSettings:
            # The tag never moves off "main", so only the digest tells a rebuild apart.
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: ghcr.io/boykush/github-management-catalog
