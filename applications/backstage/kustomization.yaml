apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - imageupdater.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - externalsecret.yaml

# What github-management's catalog finds this workload by, on the Deployments
# and Jobs as well as on their pods: the Kubernetes tab lists only the owners
# that carry it. Selectors are left alone, since they cannot change in place.
labels:
  - pairs:
      app.kubernetes.io/part-of: backstage
    includeTemplates: true

# The hash suffix on the generated name rolls the Deployment when the config changes.
configMapGenerator:
  - name: backstage-app-config
    files:
      - app-config.yaml

# Image Updater rewrites these entries, pinning the digest behind the moving
# `main` tag.
images:
  - name: ghcr.io/boykush/backstage-app
    newName: ghcr.io/boykush/backstage-app
    newTag: main
    digest: sha256:1b0631ed1f7601d057279e0a63aeb92945dbb52d83b40930cb47a5d996d6103d
  - name: ghcr.io/boykush/github-management-catalog
    newName: ghcr.io/boykush/github-management-catalog
    newTag: main
    digest: sha256:df6c1be2bf5f4349a76660a0b8792d7dbbd4dad02578082f2e850489af8aba5a
