apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - imageupdater.yaml

# The hash suffix on the generated name rolls the Deployment when the config changes.
configMapGenerator:
  - name: backstage-app-config
    files:
      - app-config.yaml

# Image Updater rewrites this entry, pinning the digest behind the moving `main`
# tag. The Backstage image itself is pinned by tag in deployment.yaml instead.
images:
  - name: ghcr.io/boykush/github-management-catalog
    newName: ghcr.io/boykush/github-management-catalog
    newTag: main
    digest: sha256:df68c3478d7162c612adfde359c181b877cf0d414ecc978b9c6a010683c8b307
