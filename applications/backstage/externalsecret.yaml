# The read-only R2 token TechDocs reads built sites with, and the endpoint it is
# for (applications/finlake/sync-cronjob.yaml says why the endpoint travels with
# the token). Publishing uses a different, read-write token that stays in CI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: techdocs-r2
  annotations:
    # On a new cluster this Application can sync before the operator's has
    # installed the CRD; the retry in backstage.yaml then carries it through.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  data:
    - secretKey: TECHDOCS_S3_ENDPOINT
      remoteRef:
        key: /cluster-secrets/backstage/techdocs-r2/TECHDOCS_S3_ENDPOINT
    - secretKey: TECHDOCS_S3_ACCESS_KEY_ID
      remoteRef:
        key: /cluster-secrets/backstage/techdocs-r2/TECHDOCS_S3_ACCESS_KEY_ID
    - secretKey: TECHDOCS_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: /cluster-secrets/backstage/techdocs-r2/TECHDOCS_S3_SECRET_ACCESS_KEY
