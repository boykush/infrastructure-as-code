# The repo-reader GitHub App's key, which the catalog reads each repository's
# catalog-info.yaml with (app-config.yaml). Backstage signs the App's JWT itself,
# so this key cannot sit in KMS like the others; it is Backstage's own key on
# that App, and revoking it stops no other reader.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github-app
  annotations:
    # On a new cluster this Application can sync before the operator's has
    # installed the CRD; the retry in backstage.yaml then carries it through.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  data:
    - secretKey: privateKey
      remoteRef:
        key: /cluster-secrets/backstage/backstage-github-app/privateKey
