# ClusterIP only: the internet reaches this through the tunnel, and only past
# Cloudflare Access. The tunnel addresses it as backstage.backstage.svc.cluster.local:7007.
apiVersion: v1
kind: Service
metadata:
  name: backstage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 7007
      targetPort: http
