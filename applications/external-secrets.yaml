# External Secrets Operator: keeps the cluster's Secrets in step with Parameter
# Store, so none is made by hand and the ExternalSecret beside each app is the
# record of what it needs. The chart is the operator; the second source is this
# repository's half, the store every ExternalSecret reads through.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    # targetRevision is the version, bumped by hand like the remote bases.
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        valuesObject:
          # The webhook only validates what is applied, and everything applied
          # here has been through review; the cert controller exists for it.
          # Without them the operator is one pod instead of three.
          webhook:
            create: false
          certController:
            create: false
          # Holds around 48Mi with this cluster's three ExternalSecrets synced
          # (measured locally on 2.12.0, in kind).
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
    - repoURL: https://github.com/boykush/infrastructure-as-code
      targetRevision: main
      path: applications/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs exceed the annotation size limit of a client-side apply.
      - ServerSideApply=true
