# Every MCP server this cluster hosts. Each one lives in its own directory under
# applications/remote-mcp-server/ and is published as its own hostname on the
# shared Cloudflare Tunnel; what they have in common is only that, so they share
# one Application rather than one per server.
#
# The images are built in the apps' own repositories, so nothing on either side
# knows when a new one lands. Image Updater closes that gap; what it follows and
# where it writes back is declared alongside the manifests, in imageupdater.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remote-mcp-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/boykush/infrastructure-as-code
    targetRevision: main
    path: applications/remote-mcp-server
  destination:
    server: https://kubernetes.default.svc
    namespace: remote-mcp-server
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
