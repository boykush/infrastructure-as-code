# The tunnel token cloudflared runs with. Its source is the tunnel_token output
# of terraform/, copied into Parameter Store by hand when the tunnel is remade.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  annotations:
    # On a new cluster this Application can sync before the operator's has
    # installed the CRD; the retry in cloudflared.yaml then carries it through.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  data:
    - secretKey: token
      remoteRef:
        key: /cluster-secrets/cloudflared/cloudflared-tunnel-token/token
