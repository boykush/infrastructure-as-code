apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - networkpolicy.yaml

# The hash suffix on the generated name rolls the Deployment when the config changes.
configMapGenerator:
  - name: jaeger-config
    files:
      - config.yaml
