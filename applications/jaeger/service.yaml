# ClusterIP only, for two callers. The collector writes traces to :4317; no
# workload is given this address (theirs is applications/otel-collector). The
# tunnel reads the UI at jaeger.jaeger.svc.cluster.local:16686, and the internet
# gets that far only past Cloudflare Access.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: query
      port: 16686
      targetPort: query
