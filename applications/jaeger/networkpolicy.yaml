# Jaeger has no login, so inside the cluster two callers may read traces, each
# with a check in front: the tunnel, past Access, for the UI, and agentgateway,
# which checks a token, for the MCP endpoint. A span can carry what a caller
# asked an MCP server. Probes from the node and port-forward, which lands on
# localhost, are beyond a NetworkPolicy's reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      ports:
        - port: 16686
          protocol: TCP
    # Writing is the collector's alone. That keeps its exporter the only place
    # this backend is named: a workload pointed straight at Jaeger does not get
    # through, so nothing can come to depend on it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - port: 4317
          protocol: TCP
