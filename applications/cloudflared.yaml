# The Cloudflare Tunnel that publishes services to the internet. Its own
# Application because the tunnel is cluster-level plumbing: one cloudflared
# carries every hostname, so it outlives any single app that happens to be
# behind it today.
# It waits on its token, which externalsecret.yaml brings from Parameter Store.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/boykush/infrastructure-as-code
    targetRevision: main
    path: applications/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    # The ExternalSecret here needs a CRD another Application installs, and on a
    # new cluster the two sync in no order. A failed sync is otherwise final.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
