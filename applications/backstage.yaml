# Backstage over boykush/github-management's catalog, served at backstage.<domain>
# through the tunnel. Guest sign-in is on and the permission policy is allow-all,
# so Cloudflare Access (terraform/access.tf) is what keeps it to the owner.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/boykush/infrastructure-as-code
    targetRevision: main
    path: applications/backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
