# The one store: every ExternalSecret in the cluster reads Parameter Store
# through it. Cluster-wide because the cluster has one owner, so a store per
# namespace would only repeat this.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-1
      # An access key, the one Secret no ExternalSecret can supply. A role is
      # out of reach: the cluster signs service account tokens as an in-cluster
      # issuer AWS cannot verify. The External Secrets Credential workflow puts
      # the key here, and all it opens is reading the parameters
      # (terraform/aws.tf).
      auth:
        secretRef:
          accessKeyIDSecretRef:
            namespace: external-secrets
            name: parameter-store-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            namespace: external-secrets
            name: parameter-store-credentials
            key: secret-access-key
