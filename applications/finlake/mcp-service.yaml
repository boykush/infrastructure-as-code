# ClusterIP only: the internet reaches this through the Cloudflare Tunnel, which
# addresses it as mcp.finlake.svc.cluster.local:8080.
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
