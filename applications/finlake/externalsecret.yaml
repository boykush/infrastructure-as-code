# The R2 token the sync CronJob reads and writes with, and the endpoint it is
# for (sync-cronjob.yaml says why the endpoint travels with the token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finlake-r2-sync
  annotations:
    # On a new cluster this Application can sync before the operator's has
    # installed the CRD; the retry in finlake.yaml then carries it through.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  data:
    - secretKey: FINLAKE_S3_ENDPOINT
      remoteRef:
        key: /cluster-secrets/finlake/finlake-r2-sync/FINLAKE_S3_ENDPOINT
    - secretKey: FINLAKE_S3_ACCESS_KEY_ID
      remoteRef:
        key: /cluster-secrets/finlake/finlake-r2-sync/FINLAKE_S3_ACCESS_KEY_ID
    - secretKey: FINLAKE_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: /cluster-secrets/finlake/finlake-r2-sync/FINLAKE_S3_SECRET_ACCESS_KEY
