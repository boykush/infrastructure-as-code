apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sync-cronjob.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - imageupdater.yaml

# Image Updater rewrites these entries, pinning the digest behind the moving
# `main` tag. One image serves every finlake workload but the dashboard; the
# subcommand picks the role.
images:
  - name: ghcr.io/boykush/finlake
    newName: ghcr.io/boykush/finlake
    newTag: main
    digest: sha256:3944defcfe7baca5d85a9194bda700d6e3331469e0323319df1b162201dd8210
  - name: ghcr.io/boykush/finlake-web
    newName: ghcr.io/boykush/finlake-web
    newTag: main
    digest: sha256:f1f2a6eb18dfc86baee2dc79ee62f55f27f296bb170ba55e32d38c28f9d1d513
