apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sync-cronjob.yaml
  - externalsecret.yaml
  - imageupdater.yaml

# Image Updater rewrites this entry, pinning the digest behind the moving `main`
# tag. One image serves every finlake workload; the subcommand picks the role.
images:
  - name: ghcr.io/boykush/finlake
    newName: ghcr.io/boykush/finlake
    newTag: main
    digest: sha256:ec288838768f6d0cb1dfe7261c1c7b2c1f48635642b87399187c54b4aebeadb7
