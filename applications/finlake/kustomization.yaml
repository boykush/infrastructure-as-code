apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sync-cronjob.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - imageupdater.yaml

# Image Updater rewrites this entry, pinning the digest behind the moving `main`
# tag. One image serves every finlake workload; the subcommand picks the role.
images:
  - name: ghcr.io/boykush/finlake
    newName: ghcr.io/boykush/finlake
    newTag: main
    digest: sha256:e07dc6cf234fc77d182168bd1cb023240157e967df5784dbb95749a175425d1d
