apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sync-cronjob.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - imageupdater.yaml

# Image Updater rewrites this entry, pinning the digest behind the moving `main`
# tag. One image serves every finlake workload; the subcommand picks the role.
images:
  - name: ghcr.io/boykush/finlake
    newName: ghcr.io/boykush/finlake
    newTag: main
    digest: sha256:a46902db3b9cd47a908d5c548107eb19c554235690d5608d3e6b2d71615640ab
