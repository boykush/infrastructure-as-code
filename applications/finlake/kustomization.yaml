apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - sync-cronjob.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - networkpolicy.yaml
  - externalsecret.yaml
  - imageupdater.yaml

# What github-management's catalog finds this workload by, on the Deployments
# and Jobs as well as on their pods: the Kubernetes tab lists only the owners
# that carry it. Selectors are left alone, since they cannot change in place.
labels:
  - pairs:
      app.kubernetes.io/part-of: finlake
    includeTemplates: true

# Image Updater rewrites these entries, pinning the digest behind the moving
# `main` tag. One image serves every finlake workload but the dashboard; the
# subcommand picks the role.
images:
  - name: ghcr.io/boykush/finlake
    newName: ghcr.io/boykush/finlake
    newTag: main
    digest: sha256:3d75fda9677b6d59dd95a7392596e54b66c62388376ae5d2fbc0ddd305275f69
  - name: ghcr.io/boykush/finlake-web
    newName: ghcr.io/boykush/finlake-web
    newTag: main
    digest: sha256:7bb03760f4c7d0dde3719dfb68d58373f8207743866770d53c5d4d7c72b90818
