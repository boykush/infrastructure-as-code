# The MCP server has no login, so inside the cluster only agentgateway may
# reach it: that is where a caller's token is checked, and this one answers
# with household money. Probes from the node and port-forward, which lands on
# localhost, are beyond a NetworkPolicy's reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentgateway
      ports:
        - port: 8080
          protocol: TCP
