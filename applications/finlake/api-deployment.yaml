# Serves the product transactions over Connect to the dashboard (web). Like the
# MCP server it has no login of its own: it stays inside the cluster, and
# networkpolicy.yaml lets only web reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # One node, and the data lives in R2, so there is no state to spread.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # The tag here is only what the kustomization's images block matches
          # on; what runs is the digest pinned there.
          image: ghcr.io/boykush/finlake:main
          # Listens on 0.0.0.0:8080 by default.
          args: ["api"]
          env:
            - name: FINLAKE_LAKE_ROOT
              value: s3://finlake
            # R2 speaks S3 with region "auto", addressed path-style.
            - name: FINLAKE_S3_REGION
              value: auto
            - name: FINLAKE_S3_URL_STYLE
              value: path
          # The same Secret as the MCP server: the server only ever reads.
          envFrom:
            - secretRef:
                name: finlake-r2-sync
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # DuckDB spills here when a query outgrows memory.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # The same binary and queries as the MCP server.
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
