name: infrastructure-as-code
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# Consent to deploy this repository's own skills from .apm/skills/; without it apm audit warns
# that the consent is only implicit.
includes: auto
# apm install generates .mcp.json, .codex/config.toml, .claude/skills/ and .agents/skills/ from
# this file and .apm/; edit those sources, not the generated files.
dependencies:
  apm:
    - boykush/ai-plugins/plugins/adr-remote-mcp#255c50e771708c4f30c7914864bff739fb88f601
    - boykush/ai-plugins/plugins/catalog-remote-mcp#255c50e771708c4f30c7914864bff739fb88f601
  mcp:
    # The plugin this repository ships (plugins/jaeger-remote-mcp/mcp.json), taken here directly:
    # through ai-plugins, a URL change would need its pin moved there and back. apm doesn't read
    # an Agent Plugin's mcp.json, so the server is declared again.
    - name: jaeger
      registry: false
      transport: http
      url: https://jaeger-mcp.boykush.com/mcp
    # Servers only this repository's agents call, so they are not in boykush/ai-plugins.
    - name: opencost
      registry: false
      transport: http
      url: https://opencost-mcp.boykush.com/mcp
