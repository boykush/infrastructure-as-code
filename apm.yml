name: infrastructure-as-code
version: 0.1.0
description: Agent config for working in this repository
targets:
  - claude
  - codex
# Consent to deploy this repository's own skills from .apm/skills/; without it apm audit warns
# that the consent is only implicit.
includes: auto
# apm install generates .mcp.json, .codex/config.toml, .claude/skills/ and .agents/skills/ from
# this file and .apm/; edit those sources, not the generated files.
dependencies:
  apm:
    - boykush/adr/plugins/adr-remote-mcp#0ace14215204963afc46838a03502819e705c4c4 # adr-remote-mcp--v0.1.0
    - boykush/ai-plugins/plugins/catalog-remote-mcp#e36040c30078bbe9b4f99094f45a52ada99ee076
    # The plugin this repository ships, taken from here as the same package its consumers get.
    - ./plugins/jaeger-remote-mcp
  mcp:
    # Servers only this repository's agents call, so no plugin ships them.
    - name: opencost
      registry: false
      transport: http
      url: https://opencost-mcp.boykush.com/mcp
